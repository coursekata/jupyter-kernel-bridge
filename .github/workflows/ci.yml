name: CI
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: uv build
      - run: npm run pack:client
      - run: npm run test:client-package
      - name: Install the wheel without source files
        run: |
          uv venv /tmp/bridge-wheel-test
          uv pip install --python /tmp/bridge-wheel-test/bin/python 'jupyterlab==4.6.3' dist/*.whl
          /tmp/bridge-wheel-test/bin/jupyter labextension list
          /tmp/bridge-wheel-test/bin/jupyter labextension list 2>&1 | grep -E '@coursekata/jupyter-kernel-bridge.*enabled.*OK'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: packages
          path: dist/
