[build-system]
requires = ["hatchling==1.30.1", "hatch-jupyter-builder==0.9.1", "hatch-nodejs-version==0.4.0", "jupyterlab==4.6.3"]
build-backend = "hatchling.build"

[project]
name = "coursekata-jupyter-kernel-bridge"
description = "Control embedded Jupyter kernels through native APIs and Comlink"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
dynamic = ["version"]

[project.urls]
Source = "https://github.com/coursekata/jupyter-kernel-bridge"
Issues = "https://github.com/coursekata/jupyter-kernel-bridge/issues"

[tool.hatch.version]
source = "nodejs"
path = "package.json"

[tool.hatch.build.hooks.jupyter-builder]
build-function = "build_hook.build_extension"
ensured-targets = ["packages/extension/labextension/package.json"]

[tool.hatch.build.targets.wheel]
bypass-selection = true
artifacts = ["share/jupyter/labextensions/@coursekata/jupyter-kernel-bridge/**"]

[tool.hatch.build.targets.wheel.shared-data]
"packages/extension/labextension" = "share/jupyter/labextensions/@coursekata/jupyter-kernel-bridge"
"packages/extension/install.json" = "share/jupyter/labextensions/@coursekata/jupyter-kernel-bridge/install.json"

[tool.hatch.build.targets.sdist]
# Avoid traversing npm workspace symlinks before their source directories.
skip-excluded-dirs = true
include = ["packages", "package.json", "package-lock.json", "pyproject.toml", "build_hook.py", "README.md", "LICENSE"]
exclude = ["**/node_modules", "**/lib", "**/dist", "**/labextension"]
